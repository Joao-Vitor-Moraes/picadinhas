services:
  - type: web
    name: imuniza-brasil-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: ALLOWED_ORIGINS
        value: "https://REPLACE-COM-O-DOMINIO-DA-VERCEL.vercel.app"
